<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Automatic Weather Updater</title>
        <link rel="stylesheet" href="styling.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jost&family=Outfit&display=swap" rel="stylesheet">
    </head>
    <body>
        <h1>Automatic Weather Updater</h1>
        <h3>The current temp is <span id="temp">Loading...</span>°F</h3>
        <h3>The current dewpoint is <span id="dewpoint">Loading...</span>°F</h3>
        <img id="conditionimage"><br>
        <input id="inputbox" oninput="fetchthing(); showTemp();"><br><br>
        <textarea readonly id="outputbox" rows="45" cols="70"></textarea>
        <script src="scripting.js"></script>
    </body>
</html>
